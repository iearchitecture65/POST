    <style>

    <div id="app">
        <div class="flex flex-col items-center justify-center h-full text-indigo-600 gap-4">
            <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-indigo-600 border-opacity-30"></div>
            <p class="font-bold text-xs tracking-widest uppercase animate-pulse">กำลังโหลดระบบ...</p>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="item-modal-container"></div>

    <div id="user-manage-modal-container"></div>
    <div id="logs-modal-container"></div>

    <div id="offscreenRenderer" style="position: fixed; top: 0; left: -3000vw; z-index: -9999; pointer-events: none; opacity: 0;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyD1z-AufMcsNqnbm3uUjoniuhdmDksYHMY",
            authDomain: "moranasatect.firebaseapp.com",
            projectId: "moranasatect",
            storageBucket: "moranasatect.firebasestorage.app",
            messagingSenderId: "592676930184",
            appId: "1:592676930184:web:a142d92aace735cff5153d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'post-manager-v3';

        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRyI-a9eEarynPfuWWbpTqHvz-vDHBGnE1UnvqvDOGIAA9nWybOkfS2jlI3xJRrpFAuR5nmWup9169/pub?gid=1236460372&single=true&output=csv";

        window.state = {
            view: 'login', 
            user: null, 
            
            currentUser: {
                passcode: '',
                name: '',
                role: 'user_b', // admin, user_a, user_b
                access: 'both' 
            },
            
            igData: [], 
            fbData: [], 
            
            usersDB: {}, 
            confirmations: {}, 
            actionLogs: [], 
            settings: { sessionTimeoutMinutes: 0 },
            sessionLoginTime: null,
            
            currentTab: 'ig', 
            searchQuery: '',
            searchResultKeys: [], 
            searchTargetSeq: '', 
            filterExtra: '', 
            copiedItems: {}, 
            activeModalItem: null,
            adminTab: 'overview', 
            
            isLoading: true,
            modal: { show: false, title: '', message: '', type: 'info', onConfirm: null },
            showPreviewModal: false,
            showUserManageModal: false,
            showLogsModal: false,
            editingUser: null, 
            
            exportOrientation: 'portrait'
        };

        window.cachedExportDataURLs = []; 
        window.currentExportGenId = 0;
        window.itemModalInterval = null; // ตัวแปรสำหรับจับเวลา Countdown

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        async function fetchSheetData() {
            try {
                const fetchUrl = DEFAULT_SHEET_URL + "&t=" + new Date().getTime();
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("HTTP Status " + response.status);
                const csvText = await response.text();
                const parsed = parseCSV(csvText);
                
                if (parsed.length > 0) {
                    const headers = parsed[0];
                    let igSeqIdx = -1, igDataIdx = -1, igExtraIdx = -1;
                    let fbSeqIdx = -1, fbDataIdx = -1, fbExtraIdx = -1;

                    headers.forEach((h, i) => {
                        if (h.includes('1.1')) igSeqIdx = i;
                        if (h.includes('1.2')) igDataIdx = i;
                        if (h.includes('1.3')) igExtraIdx = i;
                        if (h.includes('2.1')) fbSeqIdx = i;
                        if (h.includes('2.2')) fbDataIdx = i;
                        if (h.includes('2.3')) fbExtraIdx = i;
                    });

                    const igList = [];
                    const fbList = [];
                    
                    for (let i = 1; i < parsed.length; i++) {
                        const row = parsed[i];
                        if (igSeqIdx !== -1 && igDataIdx !== -1 && row[igSeqIdx]?.trim()) {
                            igList.push({ 
                                seq: row[igSeqIdx].trim(), 
                                data: row[igDataIdx].trim(),
                                extra: igExtraIdx !== -1 ? row[igExtraIdx]?.trim() || '' : ''
                            });
                        }
                        if (fbSeqIdx !== -1 && fbDataIdx !== -1 && row[fbSeqIdx]?.trim()) {
                            fbList.push({ 
                                seq: row[fbSeqIdx].trim(), 
                                data: row[fbDataIdx].trim(),
                                extra: fbExtraIdx !== -1 ? row[fbExtraIdx]?.trim() || '' : ''
                            });
                        }
                    }

                    igList.sort((a,b) => parseFloat(a.seq) - parseFloat(b.seq));
                    fbList.sort((a,b) => parseFloat(a.seq) - parseFloat(b.seq));

                    window.state.igData = igList;
                    window.state.fbData = fbList;

                    if (!window.state.isLoading) render();
                }
            } catch (error) {
                console.error("Error fetching sheet:", error);
            }
        }

        async function seedInitialUsersIfEmpty() {
            if (!window.state.user) return;
            try {
                const usersRef = doc(db, 'artifacts', appId, 'public', 'data', 'system', 'users_config');
                const docSnap = await getDoc(usersRef);
                
                if (!docSnap.exists() || Object.keys(docSnap.data() || {}).length === 0) {
                    const defaultUsers = {
                        "65030900": { passcode: "65030900", role: "admin", access: "both", isBlocked: false, name: "แอดมินหลัก" },
                        "12345678": { passcode: "12345678", role: "user_a", access: "both", isBlocked: false, name: "User A" },
                        "11111111": { passcode: "11111111", role: "user_b", access: "both", isBlocked: false, name: "User B" }
                    };
                    await setDoc(usersRef, defaultUsers);
                }
            } catch(e) { console.error("Seed error:", e); }
        }

        async function logAction(action, details) {
            if (!window.state.user) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'action_logs'), {
                    action: action,
                    details: details,
                    name: window.state.currentUser.name || window.state.currentUser.passcode,
                    role: window.state.currentUser.role,
                    timestamp: Date.now()
                });
            } catch (e) { console.error("Log error:", e); }
        }

        async function init() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, async (u) => {
                    window.state.user = u;
                    if (u) {
                        await seedInitialUsersIfEmpty();
                        listenToData();
                        await fetchSheetData();
                        
                        const settingsSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'settings'));
                        if (settingsSnap.exists()) window.state.settings = settingsSnap.data();
                        else window.state.settings = { sessionTimeoutMinutes: 0 };

                        const sessionSnap = await getDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'session', 'active'));
                        if (sessionSnap.exists()) {
                            const sessionData = sessionSnap.data();
                            const timeout = window.state.settings.sessionTimeoutMinutes * 60 * 1000;
                            const elapsed = Date.now() - sessionData.loginAt;

                            if (timeout === 0 || elapsed < timeout) {
                                const userRec = window.state.usersDB[sessionData.passcode];
                                if (userRec && !userRec.isBlocked) {
                                    window.state.currentUser = userRec;
                                    window.state.sessionLoginTime = sessionData.loginAt;
                                    
                                    if (sessionData.passcode === "65030900") window.state.currentUser.role = "admin";

                                    if (window.state.currentUser.role === 'admin') {
                                        window.state.view = 'admin';
                                        window.state.adminTab = 'overview';
                                    } else {
                                        window.state.view = 'user';
                                        window.state.currentTab = (userRec.access === 'fb') ? 'fb' : 'ig';
                                    }
                                } else if (sessionData.passcode === "65030900") {
                                    window.state.currentUser = { passcode: "65030900", role: "admin", access: "both", name: "แอดมินหลัก" };
                                    window.state.sessionLoginTime = sessionData.loginAt;
                                    window.state.view = 'admin';
                                    window.state.adminTab = 'overview';
                                } else {
                                    await deleteDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'session', 'active')).catch(()=>{});
                                }
                            } else {
                                await deleteDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'session', 'active')).catch(()=>{});
                            }
                        }
                        
                        window.state.isLoading = false; 
                        render(); 
                    } else {
                        window.state.isLoading = false;
                        render();
                    }
                });
            } catch (err) { 
                console.error("Firebase Auth Error:", err);
                window.state.isLoading = false;
                render();
            }
        }

        setInterval(() => {
            if (window.state.view !== 'login' && window.state.settings) {
                const timeout = window.state.settings.sessionTimeoutMinutes * 60 * 1000;
                if (timeout > 0 && window.state.sessionLoginTime) {
                    const elapsed = Date.now() - window.state.sessionLoginTime;
                    if (elapsed > timeout) {
                        window.uiAlert('เวลาใช้งาน (Session) หมดอายุแล้ว กรุณาเข้าสู่ระบบใหม่', 'error');
                        window.logout();
                    }
                }
            }
        }, 60000);

        function listenToData() {
            if (!window.state.user) return;
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'users_config'), (s) => {
                if (s.exists()) window.state.usersDB = s.data();
                else window.state.usersDB = {};
                if(!window.state.isLoading) render();
            });

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'post_status'), (s) => {
                if (s.exists()) window.state.confirmations = s.data();
                else setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'post_status'), {});
                if(!window.state.isLoading) render();
            });

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'action_logs'), (s) => {
                window.state.actionLogs = s.docs.map(d => ({id: d.id, ...d.data()}));
                if(!window.state.isLoading && window.state.view === 'admin') render();
            });

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'settings'), (s) => {
                if (s.exists()) window.state.settings = s.data();
                else window.state.settings = { sessionTimeoutMinutes: 0 };
                if(!window.state.isLoading && window.state.view === 'admin') render();
            });
        }

        window.handleLogin = async (e) => {
            if (e) e.preventDefault();
            const passcode = document.getElementById('login_pwd').value.trim();
            const userRec = window.state.usersDB[passcode];
            
            if (passcode === "65030900" && (!userRec || userRec.isBlocked === false)) {
                window.state.currentUser = userRec || { passcode: "65030900", role: "admin", access: "both", name: "แอดมินหลัก" };
                window.state.currentUser.role = "admin"; 
                window.state.view = 'admin';
                window.state.adminTab = 'overview';
                window.state.sessionLoginTime = Date.now();
                
                await setDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'session', 'active'), {
                    passcode: passcode,
                    loginAt: window.state.sessionLoginTime
                });

                await logAction('LOGIN', 'เข้าสู่ระบบแอดมินหลัก');
                render();
                return;
            }

            if (userRec) {
                if (userRec.isBlocked) return window.uiAlert("บัญชีนี้ถูกระงับการใช้งาน โปรดติดต่อแอดมิน", "error");
                if (userRec.passcode === "65030900") userRec.role = "admin"; 
                
                window.state.currentUser = userRec;
                window.state.sessionLoginTime = Date.now();

                await setDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'session', 'active'), {
                    passcode: passcode,
                    loginAt: window.state.sessionLoginTime
                });
                
                if (userRec.role === 'admin') {
                    window.state.view = 'admin';
                    window.state.adminTab = 'overview';
                } else {
                    window.state.view = 'user';
                    window.state.currentTab = (userRec.access === 'fb') ? 'fb' : 'ig';
                    window.state.searchQuery = '';
                    window.state.searchResultKeys = [];
                    window.state.filterExtra = '';
                }
                
                await logAction('LOGIN', `เข้าสู่ระบบสำเร็จ`);
                render();
            } else {
                window.uiAlert("รหัสเข้าใช้งานไม่ถูกต้อง", "error");
            }
        };

        window.logout = async () => {
            if (window.state.user) {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'users', window.state.user.uid, 'session', 'active')); } catch(e) {}
            }
            logAction('LOGOUT', 'ออกจากระบบ');
            window.state.view = 'login';
            window.state.currentUser = { passcode: '', role: 'user_b', access: 'both', name: '' };
            window.state.sessionLoginTime = null;
            window.state.activeModalItem = null;
            if (window.itemModalInterval) clearInterval(window.itemModalInterval);
            render();
        };

        window.setTab = (tab) => {
            window.state.currentTab = tab;
            window.state.searchQuery = '';
            window.state.searchResultKeys = [];
            window.state.searchTargetSeq = '';
            window.state.filterExtra = '';
            render();
        };

        window.setAdminTab = (tab) => {
            window.state.adminTab = tab;
            render();
        };

        window.setFilterExtra = (val) => {
            window.state.filterExtra = val;
            window.state.searchQuery = '';
            window.state.searchResultKeys = [];
            window.state.searchTargetSeq = '';
            render();
        };

        window.handleSearch = (e) => {
            e.preventDefault();
            const query = document.getElementById('search_input').value.trim();
            window.state.searchQuery = query;
            
            const dataList = window.state.currentTab === 'ig' ? window.state.igData : window.state.fbData;
            
            if (!query) {
                window.state.searchResultKeys = [];
                window.state.searchTargetSeq = '';
                render();
                return;
            }

            const targetIndex = dataList.findIndex(item => item.seq === query);
            
            if (targetIndex !== -1) {
                window.state.searchTargetSeq = query;
                window.state.searchResultKeys = [];
                
                const start = Math.max(0, targetIndex - 3);
                const end = Math.min(dataList.length - 1, targetIndex + 3);
                
                for(let i = start; i <= end; i++) {
                    window.state.searchResultKeys.push(dataList[i].seq);
                }
                
                window.openItemModal(window.state.currentTab, dataList[targetIndex]);
            } else {
                window.uiAlert(`ไม่พบข้อมูลลำดับที่ ${query}`, 'error');
                window.state.searchResultKeys = [];
                window.state.searchTargetSeq = '';
            }
            render();
        };

        window.clearSearch = () => {
            window.state.searchQuery = '';
            window.state.searchResultKeys = [];
            window.state.searchTargetSeq = '';
            render();
        };

        window.jumpToPost = (seq, tab) => {
            window.state.view = 'user';
            window.state.currentTab = tab;
            render();
            
            setTimeout(() => {
                const searchInput = document.getElementById('search_input');
                if (searchInput) {
                    searchInput.value = seq;
                    window.handleSearch({ preventDefault: () => {} });
                }
            }, 10);
        };

        window.openItemModal = (type, item) => {
            window.state.activeModalItem = { type, ...item };
            window.updateItemModalUI();
        };

        window.closeItemModal = () => {
            if (window.itemModalInterval) {
                clearInterval(window.itemModalInterval);
                window.itemModalInterval = null;
            }
            window.state.activeModalItem = null;
            window.updateItemModalUI();
        };

        window.copyData = (type, seq, text) => {
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = text;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                document.execCommand("copy");
                const key = `${type.toUpperCase()}_${seq}`;
                // บันทึกเวลาที่กดคัดลอก (หน่วยเป็น timestamp)
                window.state.copiedItems[key] = Date.now();
                
                window.uiAlert("คัดลอกข้อมูลสำเร็จ!\nกรุณากดยืนยันการโพสต์ภายใน 90 นาที", "success");
                window.updateItemModalUI();
            } catch (err) {
                window.uiAlert("ไม่สามารถคัดลอกข้อความได้", "error");
            }
            document.body.removeChild(tempTextArea);
        };

        window.markPosted = async (type, seq) => {
            if (!window.state.user) return;
            const key = `${type.toUpperCase()}_${seq}`;
            
            // เช็คเวลาหมดอายุการคัดลอกก่อนบันทึก
            const copyTime = window.state.copiedItems[key];
            const isCopied = copyTime && (Date.now() - copyTime < 90 * 60 * 1000);

            if (!isCopied && window.state.currentUser.role !== 'admin') {
                return window.uiAlert("กรุณากด 'คัดลอกข้อมูล' ก่อนถึงจะยืนยันได้\n(หรือเวลาทำการคัดลอกของคุณหมดอายุแล้ว)", "error");
            }

            try {
                const updateData = { 
                    status: true, 
                    by: window.state.currentUser.name || window.state.currentUser.passcode,
                    timestamp: Date.now() 
                };
                const newStatus = { [key]: updateData };
                
                // เคลียร์ค่าคัดลอกและ timer
                delete window.state.copiedItems[key];
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'post_status'), newStatus, { merge: true });
                await logAction('CHECK', `เช็คลิสต์โพสต์ ${type.toUpperCase()} ลำดับ ${seq}`);
                
                window.closeItemModal();
            } catch (err) {
                window.uiAlert("เกิดข้อผิดพลาดในการบันทึก", "error");
            }
        };

        window.unmarkPosted = async (type, seq) => {
            if (!window.state.user) return;
            if (window.state.currentUser.role === 'user_b') {
                return window.uiAlert("ระดับสิทธิ์ User B ไม่สามารถยกเลิกรายการที่ยืนยันไปแล้วได้", "error");
            }

            const key = `${type.toUpperCase()}_${seq}`;
            try {
                const newStatus = { [key]: null };
                delete window.state.copiedItems[key]; // บังคับให้ต้องคัดลอกใหม่หากจะยืนยันอีกครั้ง

                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'post_status'), newStatus, { merge: true });
                await logAction('UNCHECK', `ยกเลิกเช็คลิสต์โพสต์ ${type.toUpperCase()} ลำดับ ${seq}`);
                window.closeItemModal();
            } catch (err) {
                window.uiAlert("เกิดข้อผิดพลาดในการบันทึก", "error");
            }
        };

        window.openUserModal = (passcode = null) => {
            if (passcode && window.state.usersDB[passcode]) {
                window.state.editingUser = { ...window.state.usersDB[passcode], isNew: false, oldPasscode: passcode };
            } else {
                window.state.editingUser = { passcode: '', name: '', role: 'user_b', access: 'both', isBlocked: false, isNew: true };
            }
            window.state.showUserManageModal = true;
            window.updateUserManageModalUI();
        };

        window.closeUserModal = () => {
            window.state.showUserManageModal = false;
            window.state.editingUser = null;
            window.updateUserManageModalUI();
        };

        window.saveUser = async (e) => {
            e.preventDefault();
            const form = e.target;
            const u = window.state.editingUser;
            const newPasscode = form.passcode.value.trim();
            const newName = form.name.value.trim() || newPasscode;
            
            if(!newPasscode) return window.uiAlert("กรุณาระบุรหัสเข้าใช้งาน", "error");
            
            if(u.isNew && window.state.usersDB[newPasscode]) {
                return window.uiAlert("รหัสเข้าใช้งานนี้มีในระบบแล้ว", "error");
            }
            if(!u.isNew && u.oldPasscode !== newPasscode && window.state.usersDB[newPasscode]) {
                return window.uiAlert("รหัสเข้าใช้งานนี้ซ้ำกับผู้ใช้อื่นในระบบ", "error");
            }

            let assignedRole = form.role ? form.role.value : 'user_b';
            if (newPasscode === '65030900') {
                assignedRole = 'admin';
            }

            const userData = {
                passcode: newPasscode,
                name: newName,
                role: assignedRole,
                access: form.access.value,
                isBlocked: form.isBlocked ? form.isBlocked.checked : false
            };

            try {
                const newDB = { ...window.state.usersDB };
                if(!u.isNew && u.oldPasscode !== newPasscode) {
                    delete newDB[u.oldPasscode]; 
                }
                newDB[newPasscode] = userData;
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'users_config'), newDB);
                await logAction(u.isNew ? 'CREATE_USER' : 'UPDATE_USER', `จัดการผู้ใช้: ${newName}`);
                
                window.closeUserModal();
                window.uiAlert("บันทึกข้อมูลเรียบร้อย", "success");
            } catch (err) {
                window.uiAlert("เกิดข้อผิดพลาดในการบันทึก", "error");
            }
        };

        window.deleteUser = async (passcode) => {
            if(passcode === '65030900') return window.uiAlert("ไม่สามารถลบแอดมินหลักได้", "error");
            
            const uName = window.state.usersDB[passcode]?.name || passcode;
            window.uiConfirm(`ต้องการลบผู้ใช้งาน ${uName} ใช่หรือไม่?`, async () => {
                try {
                    const newDB = { ...window.state.usersDB };

                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'system', 'users_config'), newDB);

                    window.uiAlert("ลบข้อมูลเรียบร้อย", "success");
                } catch(e) { window.uiAlert("เกิดข้อผิดพลาด", "error"); }
            });
        };

                window.state.settings.sessionTimeoutMinutes = minutes;
                window.uiAlert('บันทึกการตั้งค่าเรียบร้อย', 'success');
                await logAction('UPDATE_SETTINGS', `ตั้งเวลาเซสชันเป็น ${minutes === 0 ? 'ไม่จำกัดเวลา' : minutes + ' นาที'}`);

        function renderUserView() {
            const uAccess = window.state.currentUser.access;
            const isIg = window.state.currentTab === 'ig';
            
            if (uAccess === 'fb' && isIg) window.state.currentTab = 'fb';
            if (uAccess === 'ig' && !isIg) window.state.currentTab = 'ig';
            
            const dataList = window.state.currentTab === 'ig' ? window.state.igData : window.state.fbData;
            
            const customOrder = [
                "Urban architecture",
                "Social and community",
                "Infrastructure",
                "Educational",
                "Residential",
                "Art and Culture",
                "Healthcare",
                "Sport and Activities",
                "Environment",
                "Museum"
            ];

            const uniqueExtras = [...new Set(dataList.map(item => item.extra).filter(Boolean))];
            uniqueExtras.sort((a, b) => {
                let idxA = customOrder.findIndex(o => a.includes(o));
                let idxB = customOrder.findIndex(o => b.includes(o));
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return a.localeCompare(b, 'th');
            });
            
            let isSearching = window.state.searchResultKeys.length > 0;
            
            let filteredDataList = dataList;
            if (window.state.filterExtra && !isSearching) {
                filteredDataList = dataList.filter(item => item.extra === window.state.filterExtra);
            }

            let pendingList = [];
            let historyList = [];
            
            filteredDataList.forEach(item => {
                const key = `${window.state.currentTab.toUpperCase()}_${item.seq}`;
                const confInfo = window.state.confirmations[key];
                if (confInfo && confInfo.status) {
                    historyList.push({ ...item, confInfo });
                } else {
                    pendingList.push(item);
                }
            });
            
            historyList.sort((a,b) => parseFloat(a.seq) - parseFloat(b.seq));

            let displayPending = pendingList;
            let displayHistory = historyList;

            if (isSearching) {
                const allMapped = dataList.map(item => {
                    const key = `${window.state.currentTab.toUpperCase()}_${item.seq}`;
                    return {
                        ...item,
                        confInfo: window.state.confirmations[key],
                        isTarget: item.seq === window.state.searchTargetSeq,
                        isDimmed: item.seq !== window.state.searchTargetSeq
                    };
                }).filter(item => window.state.searchResultKeys.includes(item.seq));
                
                displayPending = allMapped; 
                displayHistory = []; 
            }

            const renderItemCard = (item, isHistorySection = false) => {
                const key = `${window.state.currentTab.toUpperCase()}_${item.seq}`;
                const isPosted = item.confInfo && item.confInfo.status;
                
                let dimClass = '';
                let isClickable = true;
                const isLockedByFilter = !window.state.filterExtra && !isSearching;
                
                if (isLockedByFilter) {
                    dimClass = 'opacity-50 pointer-events-none grayscale';
                    isClickable = false;
                } else if (isSearching && item.isDimmed) {
                    dimClass = 'opacity-40 pointer-events-none grayscale';
                    isClickable = false;
                } else if (isHistorySection) {
                    dimClass = 'opacity-80 hover:opacity-100';
                } else {
                    dimClass = 'hover:-translate-y-0.5 hover:shadow-md';
                }
                
                const targetClass = item.isTarget ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-slate-200';
                const typeColor = isIg ? 'text-ig bg-pink-50' : 'text-fb bg-blue-50';

                return `
                    <div onclick="${isClickable ? `window.openItemModal('${window.state.currentTab}', {seq: '${item.seq}', data: \`${item.data.replace(/`/g, '\\`')}\`, extra: \`${item.extra.replace(/`/g, '\\`')}\`})` : ''}" 
                         class="bg-white p-3 rounded-xl border ${targetClass} shadow-sm transition-all cursor-pointer flex items-center gap-3 ${dimClass}">
                        
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center font-black text-base ${typeColor} shrink-0">
                            ${item.seq}
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">ข้อมูลโพสต์</p>
                                ${item.extra ? `<span class="px-1.5 py-0.5 bg-indigo-50 text-indigo-600 rounded text-[9px] font-bold border border-indigo-100 whitespace-nowrap overflow-hidden text-ellipsis max-w-[120px]">${item.extra}</span>` : ''}

                            <p class="text-xs font-medium text-slate-700 line-clamp-3 leading-relaxed">${item.data || 'ไม่มีข้อความ'}</p>
                            ${isPosted && !isSearching ? `<p class="text-[9px] text-slate-400 mt-1"><i data-lucide="user" size="10" class="inline"></i> โดย: ${item.confInfo.by} &bull; ${new Date(item.confInfo.timestamp).toLocaleString('th-TH')}</p>` : ''}
                        </div>

                                <span class="text-[8px] font-bold text-slate-400 mt-1 uppercase">รอดำเนินการ</span>
                            `}
                        </div>
                    </div>
                `;

                    <div class="max-w-5xl mx-auto space-y-2">

                            <select onchange="window.setFilterExtra(this.value)" class="sm:w-1/3 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-indigo-500 text-slate-600">
                                <option value="">ข้อมูลอ้างอิง (แตะเพื่อเลือก)</option>
                                ${uniqueExtras.map(ex => `<option value="${ex}" ${window.state.filterExtra === ex ? 'selected' : ''}>${ex}</option>`).join('')}
                            </select>
                            
                            <!-- Search -->
                            <form onsubmit="window.handleSearch(event)" class="relative flex-1 flex gap-2">
                                <div class="relative flex-1">
                                    <i data-lucide="search" size="14" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    <input type="text" id="search_input" value="${window.state.searchQuery}" placeholder="ค้นหาด้วยลำดับเลขโพสต์..." class="w-full pl-8 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold focus:border-indigo-500 focus:bg-white outline-none transition-all text-xs">
                                    ${window.state.searchQuery ? `

                                <i data-lucide="lock" size="16"></i>

                                <p class="text-xs font-bold">ไม่มีข้อมูลในหมวดหมู่นี้</p>

                clearInterval(window.itemModalInterval);
                window.itemModalInterval = null;
            }

            if (!item) {
                if(container) container.innerHTML = '';
                return;
            }

            const isIg = item.type === 'ig';
            const icon = isIg ? 'instagram' : 'facebook';
            const typeColor = isIg ? 'text-ig' : 'text-fb';
            const key = `${item.type.toUpperCase()}_${item.seq}`;
            
            const confInfo = window.state.confirmations[key];
            const isPosted = confInfo && confInfo.status;

            const copyTime = window.state.copiedItems[key];
            const isCopied = copyTime && (Date.now() - copyTime < 90 * 60 * 1000);
            
            const userRole = window.state.currentUser.role;
            const canCancel = userRole === 'admin' || userRole === 'user_a';

            const safeData = item.data.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');

            let actionBtnHtml = '';

                if (canCancel) {
                    actionBtnHtml = `
                        <button onclick="window.unmarkPosted('${item.type}', '${item.seq}')" class="flex items-center gap-1.5 px-3 py-2 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-lg text-xs font-bold hover:bg-emerald-100 transition-colors">
                            <i data-lucide="check-square" size="14"></i> ยืนยันแล้ว (กดยกเลิก)
                        </button>
                    `;
                } else {
                    actionBtnHtml = `
                        <button class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 text-emerald-600 border border-slate-200 rounded-lg text-xs font-bold cursor-not-allowed opacity-80">
                            <i data-lucide="check-square" size="14"></i> ยืนยันแล้ว (ล็อค)
                        </button>
                    `;
                }
            } else {
                if (isCopied) {
                    actionBtnHtml = `
                        <button id="confirm-btn-${key}" onclick="window.markPosted('${item.type}', '${item.seq}')" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold transition-all bg-slate-900 text-white hover:bg-black shadow-md flex-1">
                            <i data-lucide="square" size="14"></i> 
                            <span>คลิกเพื่อยืนยันว่าโพสต์แล้ว</span> <span id="timer-${key}" class="text-amber-400 font-mono tracking-wider ml-1"></span>
                        </button>
                    `;
                } else {
                    actionBtnHtml = `
                        <button class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold transition-all bg-slate-100 text-slate-400 cursor-not-allowed flex-1">
                            <i data-lucide="lock" size="14"></i> 
                            คัดลอกก่อนกดยืนยัน
                        </button>
                    `;
                }
            }

                                        `}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 mb-1">การเข้าถึงแพลตฟอร์ม</label>
                                    <select name="access" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-[10px] font-bold outline-none focus:border-indigo-500">
                                        <option value="both" ${u.access === 'both' ? 'selected' : ''}>ทั้ง IG และ FB</option>
                                        <option value="ig" ${u.access === 'ig' ? 'selected' : ''}>เฉพาะ IG</option>
                                        <option value="fb" ${u.access === 'fb' ? 'selected' : ''}>เฉพาะ FB</option>
                                    </select>
                                </div>
                            </div>
                            
                            <label class="flex items-center gap-2 mt-2 p-2.5 bg-red-50 rounded-xl border border-red-100 cursor-pointer">
                                <input type="checkbox" name="isBlocked" ${u.isBlocked ? 'checked' : ''} class="w-3.5 h-3.5 accent-red-500">
                                <span class="text-[10px] font-bold text-red-600">ระงับการใช้งานบัญชีนี้</span>
                            </label>

                            <button type="submit" class="w-full py-3 mt-1 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 active:scale-95 transition-all text-xs uppercase tracking-widest flex justify-center items-center gap-1.5">
                                <i data-lucide="save" size="14"></i> บันทึกข้อมูล
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.exportToExcel = () => {
            const igList = window.state.igData;
            const fbList = window.state.fbData;
            const allSeqs = [...new Set([...igList.map(i=>i.seq), ...fbList.map(i=>i.seq)])].sort((a,b) => parseFloat(a) - parseFloat(b));
            
            if(allSeqs.length === 0) return window.uiAlert("ไม่มีข้อมูลให้ส่งออก", "error");
            
            const exportData = allSeqs.map(seq => {
                const igItem = igList.find(i => i.seq === seq);
                const fbItem = fbList.find(i => i.seq === seq);
                const igConf = window.state.confirmations[`IG_${seq}`];
                const fbConf = window.state.confirmations[`FB_${seq}`];

                return {
                    'ลำดับโพสต์': seq,
                    'ข้อมูลอ้างอิง': (igItem?.extra || fbItem?.extra || '-'),
                    'สถานะ IG': igConf?.status ? 'โพสต์แล้ว' : 'รอโพสต์',
                    'ผู้โพสต์ IG': igConf?.by || '-',
                    'เวลา IG': igConf ? new Date(igConf.timestamp).toLocaleString('th-TH') : '-',
                    'สถานะ FB': fbConf?.status ? 'โพสต์แล้ว' : 'รอโพสต์',
                    'ผู้โพสต์ FB': fbConf?.by || '-',
                    'เวลา FB': fbConf ? new Date(fbConf.timestamp).toLocaleString('th-TH') : '-'
                };
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Post Status");
            XLSX.writeFile(wb, "PostManager_Report.xlsx");
        };

        const generateExportPagesHTML = () => {
            const igList = window.state.igData;
            const fbList = window.state.fbData;
            const allSeqs = [...new Set([...igList.map(i=>i.seq), ...fbList.map(i=>i.seq)])].sort((a,b) => parseFloat(a) - parseFloat(b));
            
            const rowsPerPage = 25; 
            const pagesHtml = [];
            const totalPages = Math.ceil(allSeqs.length / rowsPerPage) || 1;
            const timestamp = new Date().toLocaleString('th-TH');
            const isLandscape = window.state.exportOrientation === 'landscape';
            const pageWidth = isLandscape ? 1123 : 794;
            const pageHeight = isLandscape ? 794 : 1123;

            for (let i = 0; i < totalPages; i++) {
                const chunk = allSeqs.slice(i * rowsPerPage, (i + 1) * rowsPerPage);
                
                const rowsHtml = chunk.map(seq => {
                    const igItem = igList.find(i => i.seq === seq);
                    const fbItem = fbList.find(i => i.seq === seq);
                    const extraData = (igItem?.extra || fbItem?.extra || '-');
                    
                    const igConf = window.state.confirmations[`IG_${seq}`];
                    const fbConf = window.state.confirmations[`FB_${seq}`];

                    const getStatusHtml = (conf) => {
                        if (conf?.status) return `<div style="color: #10b981; font-weight: bold; font-size: 14px;">✔ <span style="font-size:8px; color:#94a3b8; display:block;">${conf.by}</span></div>`;
                        return `<span style="color: #cbd5e1; font-weight: bold; font-size: 14px;">-</span>`;
                    };

                    return `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 10px 10px;">
                                <div style="font-size: 12px; color: #0f172a; font-weight: 800;">${seq}</div>
                                <div style="font-size: 9px; color: #4f46e5; font-weight: bold; margin-top: 2px;">${extraData}</div>
                            </td>
                            <td style="padding: 10px 6px; text-align: center;">${getStatusHtml(igConf)}</td>
                            <td style="padding: 10px 6px; text-align: center;">${getStatusHtml(fbConf)}</td>
                        </tr>
                    `;
                }).join('');

                const pageHtml = `
                    <div id="capture-layout-wrapper-${i}" style="width: ${pageWidth}px; height: ${pageHeight}px; background-color: #ffffff; padding: 40px 50px; font-family: 'Prompt', sans-serif; display: flex; flex-direction: column; box-sizing: border-box;">
                        <style> * { font-family: 'Prompt', sans-serif !important; } </style>
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #4f46e5; padding-bottom: 15px; margin-bottom: 20px;">
                            <div>
                                <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #0f172a; text-transform: uppercase;">PostManager Report</h1>
                                <p style="margin: 4px 0 0 0; font-size: 11px; color: #64748b; font-weight: 600;">รายงานสถานะการโพสต์</p>
                            </div>
                            <div style="text-align: right;">
                                <p style="margin: 0; font-size: 12px; font-weight: 800; color: #0f172a;">หน้า ${i + 1} / ${totalPages}</p>
                                <p style="margin: 4px 0 0 0; font-size: 9px; color: #94a3b8;">${timestamp}</p>
                            </div>
                        </div>
                        <div style="flex: 1; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;">
                            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="background-color: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                                        <th style="padding: 12px 10px; font-size: 10px; font-weight: 800; color: #475569;">ลำดับ / อ้างอิง</th>
                                        <th style="padding: 12px 6px; font-size: 10px; font-weight: 800; color: #475569; text-align: center;">Instagram</th>
                                        <th style="padding: 12px 6px; font-size: 10px; font-weight: 800; color: #475569; text-align: center;">Facebook</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>
                `;
                pagesHtml.push(pageHtml);
            }
            return pagesHtml;
        };

        window.openExportPreview = async () => {
            window.state.exportOrientation = 'portrait'; 
            window.state.showPreviewModal = true;
            window.updatePreviewModalUI();
            await window.refreshExportPreview();
        };

        window.changeExportOrientation = async (orientation) => {
            window.state.exportOrientation = orientation;
            window.updatePreviewModalUI(); 
            await window.refreshExportPreview(); 
        };

        window.refreshExportPreview = async () => {
            const myGenId = ++window.currentExportGenId; 
            const previewContainer = document.getElementById('preview-images-container');
            const loadingText = document.getElementById('preview-loading-text');
            if(previewContainer) previewContainer.innerHTML = ''; 
            if(loadingText) loadingText.classList.remove('hidden');
            
            window.cachedExportDataURLs = [];
            
            try {
                await document.fonts.ready;
                const pagesHtml = generateExportPagesHTML();
                const renderer = document.getElementById('offscreenRenderer');
                
                for (let i = 0; i < pagesHtml.length; i++) {
                    if (window.currentExportGenId !== myGenId) return; 
                    renderer.innerHTML = pagesHtml[i];
                    const wrap = renderer.querySelector(`[id^="capture-layout-wrapper"]`);
                    void wrap.offsetWidth; 
                    await new Promise(r => setTimeout(r, 500)); 
                    if (window.currentExportGenId !== myGenId) return;
                    
                    const dataUrl = await htmlToImage.toPng(wrap, { quality: 0.85, pixelRatio: 1.5, cacheBust: true, useCORS: true, backgroundColor: '#ffffff' });
                    if (window.currentExportGenId !== myGenId) return; 
                    window.cachedExportDataURLs.push(dataUrl);
                    
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.className = "max-w-full h-auto rounded-xl shadow-lg border border-slate-200 fade-in";
                    document.getElementById('preview-images-container')?.appendChild(img);
                }
            } catch (e) { 
                if (window.currentExportGenId === myGenId) console.error(e);
            } finally { 
                if (window.currentExportGenId === myGenId && loadingText) loadingText.classList.add('hidden');
            }
        };

        window.closeExportPreview = () => {
            window.currentExportGenId++; 
            window.state.showPreviewModal = false;
            window.updatePreviewModalUI();
        };

        window.downloadFromPreview = (type) => {
            if (!window.cachedExportDataURLs.length) return;
            const baseName = `PostReport_${new Date().toISOString().split('T')[0]}`;
            
            if (type === 'image') {
                window.cachedExportDataURLs.forEach((url, idx) => {
                    const a = document.createElement('a'); a.download = `${baseName}_Page${idx+1}.png`; a.href = url; a.click();
                });
            } else {
                const { jsPDF } = window.jspdf;
                const isL = window.state.exportOrientation === 'landscape';
                const size = isL ? [1123, 794] : [794, 1123];
                const pdf = new jsPDF({ orientation: isL?'l':'p', unit: 'px', format: size, compress: true });
                
                window.cachedExportDataURLs.forEach((url, idx) => {
                    if (idx > 0) pdf.addPage(size, isL?'l':'p');
                    pdf.addImage(url, 'PNG', 0, 0, size[0], size[1], undefined, 'FAST');
                });
                pdf.save(`${baseName}.pdf`);
            }
        };

        window.uiAlert = (message, type = 'info') => {
            window.state.modal = { show: true, title: type === 'error' ? 'ข้อผิดพลาด' : type === 'success' ? 'สำเร็จ' : 'แจ้งเตือน', message, type, onConfirm: null };
            window.updateModalUI();
        };
        
        window.uiConfirm = (message, onConfirmCallback) => {
            window.state.modal = { show: true, title: 'ยืนยัน', message, type: 'confirm', onConfirm: onConfirmCallback };
            window.updateModalUI();
        };

        window.closeModal = () => { 
            window.state.modal.show = false; 
            window.updateModalUI(); 
        };

        window.updateModalUI = () => {
            const container = document.getElementById('modal-container');
            if (container) {
                container.innerHTML = renderUIModal();
                lucide.createIcons();
            }
        };

        function renderUIModal() {
            if (!window.state.modal.show) return "";
            const isConfirm = window.state.modal.type === 'confirm';
            let iconClass = 'bg-indigo-50 text-indigo-600', iconName = 'info';
            if (window.state.modal.type === 'error') { iconClass = 'bg-red-50 text-red-500'; iconName = 'alert-octagon'; } 
            else if (window.state.modal.type === 'success') { iconClass = 'bg-green-50 text-green-500'; iconName = 'check-circle'; }
            else if (isConfirm) { iconClass = 'bg-amber-50 text-amber-500'; iconName = 'help-circle'; }

            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 page-transition">
                    <div class="bg-white rounded-[2rem] p-5 max-w-[300px] w-full text-center shadow-2xl">
                        <div class="w-10 h-10 ${iconClass} rounded-2xl flex items-center justify-center mx-auto mb-3"><i data-lucide="${iconName}" size="20"></i></div>
                        <h3 class="text-sm font-black text-slate-800 mb-2">${window.state.modal.title}</h3>
                        <p class="text-[11px] text-slate-500 font-medium mb-4 whitespace-pre-line">${window.state.modal.message}</p>
                        ${isConfirm ? `
                            <div class="flex gap-2">
                                <button onclick="window.closeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl text-xs">ยกเลิก</button>
                                <button onclick="window.state.modal.onConfirm(); window.closeModal();" class="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs">ยืนยัน</button>
                            </div>
                        ` : `<button onclick="window.closeModal()" class="w-full py-2.5 bg-slate-900 text-white font-bold rounded-xl text-xs">ตกลง</button>`}
                    </div>
                </div>
            `;
        }

        window.updatePreviewModalUI = () => {
            const container = document.getElementById('preview-modal-container');
            if (container) {
                container.innerHTML = renderPreviewModal();
                lucide.createIcons();
            }
        };

        function renderPreviewModal() {
            if (!window.state.showPreviewModal) return "";
            const orientation = window.state.exportOrientation || 'portrait';

            return `
                <div class="fixed inset-0 z-[120] flex items-center justify-center p-3 bg-slate-900/80 backdrop-blur-sm page-transition">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[95vh] flex flex-col overflow-hidden">
                        <div class="flex justify-between items-center p-3 sm:px-4 border-b border-slate-100 shrink-0">
                            <h3 class="text-xs font-black text-slate-800 flex items-center gap-1.5"><i data-lucide="eye" class="text-indigo-500" size="14"></i> พรีวิวข้อมูลส่งออก</h3>
                            <button onclick="window.closeExportPreview()" class="p-1.5 text-slate-400 hover:bg-slate-100 rounded-full"><i data-lucide="x" size="14"></i></button>
                        </div>
                        <div class="flex-1 overflow-auto bg-[#e2e8f0] p-3 flex flex-col items-center relative min-h-[400px]">
                            <div id="preview-loading-text" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-10 bg-slate-100/50 backdrop-blur-[2px]">
                                <div class="w-8 h-8 border-4 border-slate-300 border-t-indigo-600 rounded-full animate-spin mb-2"></div>
                                <span class="font-bold text-[9px] tracking-widest uppercase">กำลังประมวลผล...</span>
                            </div>
                            <div id="preview-images-container" class="flex flex-col gap-4 w-full items-center py-2"></div>
                        </div>
                        <div class="p-3 sm:px-4 border-t border-slate-100 bg-white flex justify-end gap-2 shrink-0">
                            <button onclick="window.downloadFromPreview('image')" class="px-3 py-2 bg-indigo-600 text-white rounded-lg text-[10px] font-black"><i data-lucide="image" size="12" class="inline mr-1"></i> เซฟรูปภาพ</button>
                            <button onclick="window.downloadFromPreview('pdf')" class="px-3 py-2 bg-rose-600 text-white rounded-lg text-[10px] font-black"><i data-lucide="file-pdf" size="12" class="inline mr-1"></i> เซฟ PDF</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (window.state.isLoading) return;

            let scrollPos = 0;
            const scrollEl = document.querySelector('.scrollable-content');
            if (scrollEl) scrollPos = scrollEl.scrollTop;

            let mainContent = '';
            if (window.state.view === 'login') {
                mainContent = renderLogin();
            } else if (window.state.view === 'user') {
                mainContent = renderUserView();
            } else if (window.state.view === 'admin') {
                mainContent = renderAdminView();
            }

            app.innerHTML = mainContent;

            const newScrollEl = document.querySelector('.scrollable-content');
            if (newScrollEl) newScrollEl.scrollTop = scrollPos;

            window.updateModalUI();
            window.updateItemModalUI();
            window.updateUserManageModalUI();
            window.updatePreviewModalUI();
            lucide.createIcons();
        }

        init();

    </script>
</body>
</html>
